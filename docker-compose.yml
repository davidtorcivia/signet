# Deploy target: /srv/apps/signet/docker-compose.yml on erebus.
# One directory per app, per the box convention.
#
# Unlike most apps here, signet is NOT fronted by Caddy: the Cloudflare Tunnel points straight
# at it. cloudflared runs on the host under systemd (`tunnel run --token`), so it reaches
# 127.0.0.1:8300 directly. That means no shared Docker network, no reverse-proxy stanza, and
# nothing published on the LAN — signet keeps its own default network, which is what
# docs/02-architecture.md asks for under Blast radius.
#
# Runs locally with no changes: `docker compose up -d`.
services:
  signet-api:
    build: .
    image: signet:0.1.0
    container_name: signet-api
    restart: unless-stopped
    env_file: .env
    # Run as the host user that owns ./data, so the bind-mounted journal is writable by the
    # container and readable/backup-able by you. The image's own `signet` user (uid 10001)
    # cannot write to a directory owned by uid 1000, which is exactly how the first deploy
    # failed. Override per-host with SIGNET_UID/SIGNET_GID in .env if the owner differs;
    # `id -u` / `id -g` on the box gives the right values.
    user: "${SIGNET_UID:-1000}:${SIGNET_GID:-1000}"
    environment:
      SIGNET_DATA_DIR: /data
      SIGNET_HOST: 0.0.0.0
      SIGNET_PORT: "8300"
    volumes:
      - ./data:/data
    # Loopback only. cloudflared runs on the host, so the tunnel reaches this; the LAN cannot.
    # Also what `scripts/legacy_handshake.py` talks to when run on erebus.
    ports:
      - "127.0.0.1:8300:8300"
    # Blast radius (docs/02-architecture.md, Security). A voice agent reachable by a button
    # pressed through a trouser pocket gets the tightest container settings that still work.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8300/healthz', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Weather, as an upstream MCP server rather than a capability written here.
  #
  # It earns its place on cost rather than novelty: "what's it doing tomorrow" otherwise falls
  # through to an Exa search at ~$0.007, or worse, gets answered from training data. Open-Meteo
  # is free and needs no account, so the only key involved is the one below, which guards this
  # container rather than anything upstream.
  #
  # Pinned to an exact version. `latest` in a committed compose file means a deploy six months
  # from now is a different program with the same name.
  openmeteo:
    image: ghcr.io/cmer81/open-meteo-mcp:2.0.1
    container_name: signet-openmeteo
    restart: unless-stopped
    environment:
      # The image already sets TRANSPORT=http, HOST=0.0.0.0 and PORT=3000.
      #
      # Empty means the server accepts anything, which is why nothing is published below: on the
      # project's private network only signet can reach it. Set it in .env anyway — signet sends
      # it as the upstream's auth header, so a real value keeps the credential path identical to
      # every other upstream instead of leaving one server as the special case that skips it.
      API_KEY: ${OPENMETEO_API_KEY:-}
    # Deliberately no `ports:`. signet reaches it at http://openmeteo:3000/mcp over the compose
    # project's default network; the host and the LAN cannot reach it at all.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /health is exempt from both auth and rate limiting, so this stays honest when API_KEY
      # is set. Node 22 has fetch built in, so this needs nothing added to the image.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
