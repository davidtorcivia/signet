<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="/app/favicon.svg?v={{ favicon_version }}"><title>signet</title>
<style>
:root { --paper:#fff; --ink:#111; --muted:#6e6e6e; --line:#e2e2e2; --accent:#c1272d; --bad:#b3261e; }
@media (prefers-color-scheme: dark) {
  :root { --paper:#0e0e10; --ink:#ededed; --muted:#8d8d90; --line:#2a2a2e;
          --accent:#e2564f; --bad:#e2726a; }
}
* { box-sizing: border-box; }
body {
  margin:0; min-height:100vh; display:grid; place-items:center; padding:1rem;
  background:var(--paper); color:var(--ink);
  font:15px/1.5 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
form { width:min(22rem,100%); border:1px solid var(--line); padding:1.5rem; }
.mark { width:.8rem; height:.8rem; background:var(--accent); display:inline-block; margin-right:.5rem; }
h1 { font-size:.92rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; margin:0 0 1.2rem; }
input {
  width:100%; font:inherit; padding:.65rem; min-height:44px; border-radius:0;
  border:1px solid var(--line); background:var(--paper); color:inherit;
}
input:focus { outline:2px solid var(--accent); outline-offset:-2px; }
button {
  width:100%; margin-top:.7rem; font:inherit; font-size:.72rem; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; padding:.7rem; min-height:44px; border-radius:0;
  border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer;
}
.err { color:var(--bad); font-size:.82rem; margin-bottom:.7rem; }
</style></head><body>
<form method="post" action="/app/login">
  <h1><span class="mark"></span>signet</h1>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input type="password" name="password" placeholder="Password" autofocus required>
  <button>Sign in</button>
</form>
</body></html>
