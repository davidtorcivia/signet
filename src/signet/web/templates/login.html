<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><title>signet</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbfaf8;color:#1b1a19;
font:16px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
@media(prefers-color-scheme:dark){body{background:#16151a;color:#eceaea}}
form{display:grid;gap:.75rem;width:min(22rem,90vw)}
input,button{font:inherit;padding:.7rem;border-radius:8px;min-height:44px}
input{border:1px solid #ccc;width:100%;background:transparent;color:inherit}
button{border:0;background:#7c4a2d;color:#fff;font-weight:600}
.err{color:#9b2c25;font-size:.85rem}
</style></head><body>
<form method="post" action="/app/login">
  <h1 style="font-size:1.1rem;margin:0">signet</h1>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input type="password" name="password" placeholder="Password" autofocus required>
  <button>Sign in</button>
</form>
</body></html>
