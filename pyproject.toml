[project]
name = "signet"
version = "0.1.0"
description = "Self-hosted MCP server and agent gateway for the Pebble Index 01 ring"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp>=1.9",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
signet = "signet.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signet"]
artifacts = ["src/signet/migrations/*.sql"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff formats Python code blocks inside Markdown. The design docs' snippets are
# hand-aligned for reading, not for the formatter; keep it out of them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
